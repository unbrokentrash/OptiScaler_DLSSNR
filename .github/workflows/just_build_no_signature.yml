# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build (No Signing)

on:
  workflow_dispatch:
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        
    - name: Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        # Ensure the file exists before proceeding
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }
        
        # Helper function to extract the first matching line for a version component
        function Get-Version-Component {
            param (
                [string]$pattern,
                [string]$replacement
            )
            # Use Select-String and take only the first match
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) {
                return ($line.Line -replace $replacement).Trim()
            } else {
                Write-Error "Pattern not found: $pattern"
                exit 1
            }
        }
        
        # Extract version components (only the first match for each pattern)
        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'
        
        # Merge into a single version string
        $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"
        
        # Get the current date in a specific format (e.g., YYYYMMDD)
        $date = Get-Date -Format "yyyyMMdd"
        
        # Construct the output filename with version and date
        $outputFileName = "OptiScaler_${version}_${date}"
        
        # Output the generated filename
        Write-Output "Generated Filename: $outputFileName"
        
        # Write outputs to GITHUB_OUTPUT
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        
      continue-on-error: false
      
    - name: Debug Outputs
      run: |
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo "Filename: ${{ steps.get_version.outputs.filename }}"
        
    # The Neural Rendering composition shader ships as a checked-in blob with no source fallback, so
    # editing dlssnr.hlsl does nothing until it is recompiled -- and the D3D12 one has to be signed by
    # dxil.dll, which is Windows-only. Doing it here means the DLL below is built against the shader
    # that is actually in the tree, and the regenerated headers come out as artifacts to commit.
    - name: Recompile the Neural Rendering shader
      shell: pwsh
      working-directory: OptiScaler/shaders/dlssnr/precompile
      env:
        # For the release lookup below. Anonymous API calls are rate limited per runner IP address,
        # which is shared, so a build could fail for having been unlucky about who else was building.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $candidates = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse `
                        -Filter dxc.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object FullName -Descending

        if (-not $candidates) { throw "no dxc.exe in the Windows SDK" }

        $dxc = $candidates[0].FullName
        Write-Host "using $dxc"

        & $dxc -T cs_6_0 -E CSMain -Fo DlssNr_Shader.cso dlssnr.hlsl
        if ($LASTEXITCODE -ne 0) { throw "the D3D12 compile failed" }

        # A second compiler for the Vulkan leg, because the Windows SDK's is built without one.
        #
        # dxc has two back ends and the SDK ships only DXIL: asked for SPIR-V it answers "SPIR-V
        # CodeGen not available. Please recompile with -DENABLE_SPIRV_CODEGEN=ON" and returns 1. The
        # standalone DirectXShaderCompiler release is the same compiler built with both, so the
        # Vulkan blob is produced by that and the D3D12 blob stays with the SDK's -- which is the one
        # that signs, since signing is dxil.dll's job and the SDK has it beside the compiler.
        $headers = @{ 'User-Agent' = 'optiscaler-ci' }
        if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }

        $release = Invoke-RestMethod -Headers $headers `
                     "https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -like 'dxc_*.zip' } | Select-Object -First 1

        if (-not $asset) { throw "no dxc_*.zip in the latest DirectXShaderCompiler release" }

        Write-Host "SPIR-V compiler: $($release.tag_name) / $($asset.name)"
        Invoke-WebRequest $asset.browser_download_url -OutFile dxc-release.zip
        Expand-Archive dxc-release.zip -DestinationPath dxc-release -Force

        $spirvDxc = Get-ChildItem dxc-release -Recurse -Filter dxc.exe |
                    Where-Object { $_.FullName -match '\\x64\\' } |
                    Select-Object -First 1

        if (-not $spirvDxc) { throw "no x64 dxc.exe in $($asset.name)" }

        & $spirvDxc.FullName -T cs_6_0 -E CSMain -D VK_MODE=1 -spirv -Fo DlssNr_Shader_Vk.spv dlssnr.hlsl
        if ($LASTEXITCODE -ne 0) { throw "the SPIR-V compile failed" }

        python make_header.py DlssNr_Shader.cso    DlssNr_cso  DlssNr_Shader.h
        python make_header.py DlssNr_Shader_Vk.spv dlssnr_spv  DlssNr_Shader_Vk.h

        # Unsigned DXIL is refused at pipeline creation, and the signature is the sixteen bytes after
        # the magic -- all zero means dxil.dll never ran and the pass would silently fail to compile.
        $cso = [System.IO.File]::ReadAllBytes("DlssNr_Shader.cso")
        if ([System.Text.Encoding]::ASCII.GetString($cso[0..3]) -ne "DXBC") { throw "not a DXBC container" }
        if ((($cso[4..19]) | Where-Object { $_ -ne 0 }).Count -eq 0) { throw "the D3D12 blob is unsigned" }

        $spv = [System.IO.File]::ReadAllBytes("DlssNr_Shader_Vk.spv")
        if ([System.BitConverter]::ToUInt32($spv, 0) -ne 0x07230203) { throw "not SPIR-V" }

        Write-Host "D3D12 $($cso.Length) bytes signed, Vulkan $($spv.Length) bytes"

    - name: Upload the regenerated shader headers
      uses: actions/upload-artifact@v7.0.0
      with:
        name: dlssnr-shader-headers
        path: |
          OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h
          OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h
        if-no-files-found: error

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal
      
    - name: Compress the artifact 
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r ${{ github.workspace }}\$zipName ${{ github.workspace }}\x64\Release\a\*.*

      continue-on-error: false
        
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error
